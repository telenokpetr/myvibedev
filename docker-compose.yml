services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  web:
    build: ./web
    restart: unless-stopped
    env_file: .env
    environment:
      # Веб-интерфейс управляет БРАУЗЕРНЫМИ ботами (два слота — два мероприятия
      # параллельно). Слот 0 = bot-browser, слот 1 = bot-browser-2. Каждый — свой
      # аккаунт/профиль (иначе конфликт хоста). Здесь /account/*, /session/*,
      # модерация, зал ожидания, медиа.
      BOT_WORKER_URLS: "http://bot-browser:9100,http://bot-browser-2:9100"
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./web:/app
      - screenshots:/data/screenshots
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  # Браузерный бот: Zoom web-клиент через Playwright (headful под Xvfb).
  # Один участник делает и модерацию чата (DOM), и музыку (fake-mic, в планах).
  # Заменяет desktop-воркеров с их хрупким OCR/GUI — см. docs/RELIABILITY-PLAN.
  bot-browser:
    build: ./bot-browser
    image: myvibedev-bot-browser
    restart: unless-stopped
    env_file: .env
    init: true
    shm_size: "1gb"
    environment:
      BOT_NAME: "Веб-модератор"
      WEB_CALLBACK_URL: "http://web:8000"
      # Пусто = бандловый Chromium. С настоящим Chrome ("chrome") Zoom при
      # включении камеры выдаёт «Что-то пошло не так, закройте все браузеры» и
      # шлёт чёрный кадр: с canvas-потоком его конвейер под Chrome не работает
      # (в контейнере нет GPU). В Chromium тот же поток идёт нормально, но там
      # нет H.264/AAC — поэтому ролики перегоняем в WebM при загрузке.
      BROWSER_CHANNEL: ""
      SHOTS_DIR: "/data"
      RECORDINGS_DIR: "/data/recordings"
      REC_GEOMETRY: "1280x720"
    ports:
      - "9100:9100"   # управляющий API браузерного бота
      # noVNC — экран браузера бота для РУЧНОГО входа в Zoom-аккаунт.
      # Только 127.0.0.1: доступ с этой машины, наружу порт закрыт.
      - "127.0.0.1:6080:6080"
    depends_on:
      - web
    volumes:
      - ./bot-browser:/app          # монтируем код (правки без пересборки образа)
      # Cookie-сессия Zoom: файл монтируется НАПРЯМУЮ, чтобы после нового
      # экспорта (Cookie-Editor → JSON) не нужен был docker cp — бот подхватит
      # свежий файл при следующем входе сам.
      - ./zoom-cookies.json:/data/zoom-cookies.json:ro
      - botshots:/data
      - browser-recordings:/data/recordings
    # без --reload: watchfiles на правку кода перезапускал процесс и ронял
    # live-сессию браузера (плюс плодил зомби-вкладки в митинге). Для перезапуска
    # после правок — docker compose restart bot-browser.
    command: uvicorn app.main:app --host 0.0.0.0 --port 9100

  # ВТОРОЙ браузерный бот (слот 1) — точная копия первого, но со СВОИМ профилем,
  # томами и портами. Нужен для второго мероприятия параллельно. Свой Zoom-аккаунт
  # заводится так же — ручным входом через noVNC на порту 6081 (см. account.py).
  # Тот же код (./bot-browser:/app) и образ — бот идентичный первому.
  bot-browser-2:
    build: ./bot-browser
    image: myvibedev-bot-browser
    restart: unless-stopped
    env_file: .env
    init: true
    shm_size: "1gb"
    environment:
      BOT_NAME: "Веб-модератор"
      WEB_CALLBACK_URL: "http://web:8000"
      BROWSER_CHANNEL: ""
      SHOTS_DIR: "/data"
      RECORDINGS_DIR: "/data/recordings"
      REC_GEOMETRY: "1280x720"
    ports:
      - "9101:9100"   # API второго бота (внутри контейнера порт тот же 9100)
      - "127.0.0.1:6081:6080"   # noVNC второго бота — экран для ручного входа
    depends_on:
      - web
    volumes:
      - ./bot-browser:/app                     # тот же код = идентичный бот
      # Свои cookie второго аккаунта (создай пустой файл, если импорт не нужен).
      - ./zoom-cookies-2.json:/data/zoom-cookies.json:ro
      - botshots-2:/data                       # ОТДЕЛЬНЫЙ профиль/данные
      - browser-recordings-2:/data/recordings
    command: uvicorn app.main:app --host 0.0.0.0 --port 9100

volumes:
  db-data:
  screenshots:            # используется web
  botshots:
  browser-recordings:
  botshots-2:
  browser-recordings-2:
