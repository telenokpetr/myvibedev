services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  web:
    build: ./web
    restart: unless-stopped
    env_file: .env
    environment:
      # Веб-интерфейс управляет БРАУЗЕРНЫМ ботом (bot-browser:9100), а не старым
      # desktop-воркером. Здесь живут /account/*, /session/*, модерация, запись.
      BOT_WORKER_URLS: "http://bot-browser:9100"
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./web:/app
      - screenshots:/data/screenshots
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  bot-worker:
    build: ./bot-worker
    image: myvibedev-bot-worker
    restart: unless-stopped
    env_file: .env
    # tini как pid1 — корректно «хоронит» дочерние процессы Zoom (zombie reaping)
    init: true
    # Zoom-клиенту нужно больше /dev/shm, иначе падает рендер
    shm_size: "1gb"
    environment:
      SCREEN_GEOMETRY: "1920x1080x24"
      ZOOM_BOT_NAME: "Модератор IPDC @telenokpetr"
      RECORDINGS_DIR: "/data/recordings"
      SCREENSHOTS_DIR: "/data/screenshots"
      WEB_CALLBACK_URL: "http://web:8000"
      # tesseract: paddle-инференс каждые 2с съедал CPU, Zoom терял соединение
      # и вылетал из митинга; paddle остаётся опцией (CHAT_READER=paddle)
      CHAT_READER: "tesseract"
    ports:
      - "9000:9000"   # управляющий API bot-worker (для тестов/отладки)
    depends_on:
      - web
    volumes:
      - recordings:/data/recordings
      - screenshots:/data/screenshots
      - music:/data/music
      # Профиль Zoom (логин, «Stay signed in») — чтобы вход переживал пересоздание
      # контейнера и не требовал OTP каждый раз.
      - zoomprofile:/home/zoom

  # Второй воркер — для модерации второго вебинара параллельно (свой Zoom-клиент,
  # аккаунт, дисплей, аудио). Тот же образ, отдельные volume.
  bot-worker-2:
    image: myvibedev-bot-worker
    restart: unless-stopped
    env_file: .env
    init: true
    shm_size: "1gb"
    environment:
      SCREEN_GEOMETRY: "1920x1080x24"
      ZOOM_BOT_NAME: "Модератор IPDC @telenokpetr"
      RECORDINGS_DIR: "/data/recordings"
      SCREENSHOTS_DIR: "/data/screenshots"
      WEB_CALLBACK_URL: "http://web:8000"
      CHAT_READER: "tesseract"
    ports:
      - "9001:9000"
    depends_on:
      - web
    volumes:
      - recordings-2:/data/recordings
      - screenshots-2:/data/screenshots
      - music-2:/data/music
      - zoomprofile-2:/home/zoom

  # Браузерный бот: Zoom web-клиент через Playwright (headful под Xvfb).
  # Один участник делает и модерацию чата (DOM), и музыку (fake-mic, в планах).
  # Заменяет desktop-воркеров с их хрупким OCR/GUI — см. docs/RELIABILITY-PLAN.
  bot-browser:
    build: ./bot-browser
    image: myvibedev-bot-browser
    restart: unless-stopped
    env_file: .env
    init: true
    shm_size: "1gb"
    environment:
      BOT_NAME: "Веб-модератор"
      WEB_CALLBACK_URL: "http://web:8000"
      # Пусто = бандловый Chromium. С настоящим Chrome ("chrome") Zoom при
      # включении камеры выдаёт «Что-то пошло не так, закройте все браузеры» и
      # шлёт чёрный кадр: с canvas-потоком его конвейер под Chrome не работает
      # (в контейнере нет GPU). В Chromium тот же поток идёт нормально, но там
      # нет H.264/AAC — поэтому ролики перегоняем в WebM при загрузке.
      BROWSER_CHANNEL: ""
      SHOTS_DIR: "/data"
      RECORDINGS_DIR: "/data/recordings"
      REC_GEOMETRY: "1280x800"
    ports:
      - "9100:9100"   # управляющий API браузерного бота
    depends_on:
      - web
    volumes:
      - ./bot-browser:/app          # монтируем код (правки без пересборки образа)
      # Cookie-сессия Zoom: файл монтируется НАПРЯМУЮ, чтобы после нового
      # экспорта (Cookie-Editor → JSON) не нужен был docker cp — бот подхватит
      # свежий файл при следующем входе сам.
      - ./zoom-cookies.json:/data/zoom-cookies.json:ro
      - botshots:/data
      - browser-recordings:/data/recordings
    # без --reload: watchfiles на правку кода перезапускал процесс и ронял
    # live-сессию браузера (плюс плодил зомби-вкладки в митинге). Для перезапуска
    # после правок — docker compose restart bot-browser.
    command: uvicorn app.main:app --host 0.0.0.0 --port 9100

volumes:
  db-data:
  recordings:
  screenshots:
  music:
  zoomprofile:
  recordings-2:
  screenshots-2:
  music-2:
  zoomprofile-2:
  botshots:
  browser-recordings:
