services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  web:
    build: ./web
    restart: unless-stopped
    env_file: .env
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./web:/app
      - screenshots:/data/screenshots
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  bot-worker:
    build: ./bot-worker
    restart: unless-stopped
    env_file: .env
    # tini как pid1 — корректно «хоронит» дочерние процессы Zoom (zombie reaping)
    init: true
    # Zoom-клиенту нужно больше /dev/shm, иначе падает рендер
    shm_size: "1gb"
    environment:
      SCREEN_GEOMETRY: "1280x720x24"
      ZOOM_BOT_NAME: "Модератор"
      RECORDINGS_DIR: "/data/recordings"
      SCREENSHOTS_DIR: "/data/screenshots"
      WEB_CALLBACK_URL: "http://web:8000"
    ports:
      - "9000:9000"   # управляющий API bot-worker (для тестов/отладки)
    depends_on:
      - web
    volumes:
      - recordings:/data/recordings
      - screenshots:/data/screenshots

volumes:
  db-data:
  recordings:
  screenshots:
