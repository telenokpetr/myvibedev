<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Zoom Bot Console — мероприятия</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <header>
    <h1>🎥 Zoom Bot Console</h1>
    <span class="badge" id="status">проверка…</span>
  </header>

  <main>
    <section class="card">
      <h2>Новое мероприятие</h2>
      <p class="hint">Бот зайдёт по ссылке под своим аккаунтом, введёт код организатора
         и станет организатором/со-организатором, затем при необходимости включит запись.</p>
      <form id="event-form" class="grid">
        <label class="wide">Ссылка на мероприятие *
          <input name="join_url" required placeholder="https://zoom.us/j/123456789?pwd=...">
        </label>
        <label>Название
          <input name="title" maxlength="255" placeholder="необязательно">
        </label>
        <label>Код доступа
          <input name="passcode" placeholder="если не в ссылке">
        </label>
        <label>Код организатора (host key)
          <input name="host_key" maxlength="32" placeholder="напр. 654321">
        </label>
        <label>Длительность (мин)
          <input name="duration_min" type="number" min="1" max="1440" value="60" required>
        </label>

        <fieldset class="wide mode">
          <legend>Когда запускать</legend>
          <label class="radio"><input type="radio" name="mode" value="now" checked> Сейчас</label>
          <label class="radio"><input type="radio" name="mode" value="scheduled"> По расписанию</label>
          <input name="start_time" type="datetime-local" disabled>
        </fieldset>

        <label class="check">
          <input name="record" type="checkbox"> Включать запись
        </label>
        <label class="check">
          <input name="moderate" type="checkbox" checked> Модерация чата
        </label>

        <div class="actions wide">
          <button type="submit">Добавить</button>
          <span id="form-msg" class="msg"></span>
        </div>
      </form>
    </section>

    <section class="card">
      <h2>Мероприятия</h2>
      <div class="table-wrap">
        <table id="events">
          <thead>
            <tr>
              <th>Старт</th><th>Название / ссылка</th><th>Длит.</th>
              <th>Host key</th><th>Запись</th><th>Модер.</th>
              <th>Статус</th><th></th>
            </tr>
          </thead>
          <tbody><tr><td colspan="8" class="muted">загрузка…</td></tr></tbody>
        </table>
      </div>
    </section>
  </main>

  <script src="/static/app.js"></script>
</body>
</html>
