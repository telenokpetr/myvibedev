<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Zoom Bot Console — расписание</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <header>
    <h1>🎥 Zoom Bot Console</h1>
    <span class="badge" id="status">проверка…</span>
  </header>

  <main>
    <section class="card">
      <h2>Новая лекция</h2>
      <form id="lecture-form" class="grid">
        <label>Название
          <input name="title" required maxlength="255" placeholder="Лекция по матанализу">
        </label>
        <label>Начало
          <input name="start_time" type="datetime-local" required>
        </label>
        <label>Длительность (мин)
          <input name="duration_min" type="number" min="1" max="1440" value="60" required>
        </label>
        <label>Meeting ID
          <input name="zoom_meeting_id" placeholder="123 4567 8901">
        </label>
        <label class="wide">Ссылка на вход (Join URL)
          <input name="zoom_join_url" placeholder="https://zoom.us/j/...">
        </label>
        <label>Код доступа
          <input name="zoom_passcode" placeholder="необязательно">
        </label>
        <label class="check">
          <input name="record" type="checkbox"> Включать запись
        </label>
        <label class="check">
          <input name="moderate" type="checkbox" checked> Вести модерацию чата
        </label>
        <div class="actions wide">
          <button type="submit">Добавить в расписание</button>
          <span id="form-msg" class="msg"></span>
        </div>
      </form>
    </section>

    <section class="card">
      <h2>Расписание</h2>
      <div class="table-wrap">
        <table id="lectures">
          <thead>
            <tr>
              <th>Начало</th><th>Название</th><th>Длит.</th>
              <th>Meeting</th><th>Запись</th><th>Модер.</th>
              <th>Статус</th><th></th>
            </tr>
          </thead>
          <tbody><tr><td colspan="8" class="muted">загрузка…</td></tr></tbody>
        </table>
      </div>
    </section>
  </main>

  <script src="/static/app.js"></script>
</body>
</html>
